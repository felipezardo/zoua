<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa do Historiador – O Um Anel 2e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mesa.css">
</head>
<body data-vista="mesa">
<nav class="barra" aria-label="Navegação da Mesa">
  <a class="voltar" href="index.html" aria-label="Voltar para as fichas dos jogadores"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Fichas</span></a>
  <div class="abas" id="abas" role="tablist" aria-label="Seções da Mesa">
    <button type="button" role="tab" aria-selected="true" data-aba="combate" class="on">Combate</button>
    <button type="button" role="tab" aria-selected="false" data-aba="cenas">Cenas</button>
    <button type="button" role="tab" aria-selected="false" data-aba="companhia">Companhia</button>
    <button type="button" role="tab" aria-selected="false" data-aba="adversarios">Adversários</button>
  </div>
  <div class="barra-dir"><button type="button" id="rede-bt" class="rede-bt" data-estado="desconectado" aria-label="Conectar a uma sala da mesa" title="Conectar a uma sala da mesa"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5a11 11 0 0 1 15 0"/><path d="M7.5 12.8a6.6 6.6 0 0 1 9 0"/><path d="M10.5 16a2.2 2.2 0 0 1 3 0"/><circle cx="12" cy="19" r=".8" fill="currentColor"/></svg><span class="rede-dot" aria-hidden="true"></span><span class="rede-n" hidden></span></button><button type="button" id="tema" class="tema" aria-label="Mudar para o tema escuro" aria-pressed="false" title="Mudar para o tema escuro">
    <svg class="i-lua" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path transform="translate(1.5 -2.1)" d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" fill="currentColor"/></svg>
    <svg class="i-sol" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.6v2.4M12 19v2.4M2.6 12H5M19 12h2.4M5.35 5.35l1.7 1.7M16.95 16.95l1.7 1.7M5.35 18.65l1.7-1.7M16.95 7.05l1.7-1.7"/></g></svg>
  </button></div>
</nav>

<main class="mesa">
  <section id="v-combate" class="vista" aria-label="Combate"></section>
  <section id="v-cenas" class="vista" aria-label="Cenas" hidden></section>
  <section id="v-companhia" class="vista" aria-label="Companhia" hidden></section>
  <section id="v-adversarios" class="vista" aria-label="Adversários" hidden></section>
</main>

<dialog id="dlg-ficha" aria-labelledby="df-t"><div class="dlg-corpo" id="df-corpo"></div><div class="dlg-botoes"><button type="button" data-fechar>Fechar</button></div></dialog>
<dialog id="dlg-adv" aria-labelledby="da-t"><div class="dlg-corpo" id="da-corpo"></div><div class="dlg-botoes"><button type="button" data-fechar>Fechar</button></div></dialog>
<dialog id="dlg-token" aria-labelledby="dt-t"><div class="dlg-corpo" id="dt-corpo"></div><div class="dlg-botoes"><button type="button" data-fechar>Fechar</button></div></dialog>
<dialog id="dlg-criar" aria-labelledby="dc-t"><div class="dlg-corpo" id="dc-corpo"></div></dialog>
<dialog id="dlg-confirma" aria-labelledby="confirma-t">
  <h3 id="confirma-t"></h3><p id="confirma-msg"></p>
  <div class="dlg-botoes"><button type="button" id="confirma-sim">Confirmar</button><button type="button" id="confirma-nao">Cancelar</button></div>
</dialog>
<input type="file" id="arq-fichas" accept=".json,application/json" multiple hidden>
<input type="file" id="arq-mesa" accept=".json,application/json" hidden>
<input type="file" id="arq-img" accept="image/*" hidden>
<input type="file" id="arq-cena-img" accept="image/*" hidden>

<script src="data.js"></script>
<script src="adversarios-data.js"></script>
<script src="rolagem.js"></script>
<script>window.REDE_PAPEL = 'gm'; window.REDE_NOME = () => 'Historiador';</script>
<script src="rede.js"></script>
<script src="rede-ui.js"></script>
<script src="mesa-exemplo.js"></script>
<script src="visor.js"></script>
<script src="mesa.js"></script>
<script src="cena-gm.js"></script>
</body>
</html>
